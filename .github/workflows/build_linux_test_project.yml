name: Build Project + Test Project - Linux

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_linux_test_project.yml'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write       # Required for actions/upload-release-asset to upload release asset
    runs-on: ubuntu-latest

    # WARNING: Project (internal) name could not be the same as repository name
    env:
      PROJECT_NAME: rpb
      PROJECT_REPO_NAME: ${{ github.event.repository.name }}
      PROJECT_BUILD_PATH: ${{ github.event.repository.name }}/src
      PROJECT_RELEASE_PATH: rpb_dev_linux_x64
      PROJECT_SOURCES: "'rpb.c external/tinyfiledialogs.c'"
      PROJECT_RESOURCES_SRC_PATH: src/resources
      PROJECT_RESOURCES_DST_PATH: resources
      PROJECT_CUSTOM_FLAGS: ""

    steps:
    - name: Checkout this repo
      uses: actions/checkout@master
      with:
        path: ${{ env.PROJECT_REPO_NAME }}

    - name: Checkout raylib repo
      uses: actions/checkout@master
      with:
        repository: raysan5/raylib
        path: raylib

    - name: Setup Release Paths
      run: |
        echo "PROJECT_VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
        echo "PROJECT_RELEASE_PATH=${{ env.PROJECT_NAME }}_v${{ github.event.release.tag_name }}_linux_x64" >> $GITHUB_ENV
      shell: bash
      if: github.event_name == 'release' && github.event.action == 'published'

    - name: Setup Environment
      run: | 
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends libglfw3 libglfw3-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxext-dev libxfixes-dev libwayland-dev libxkbcommon-dev
        mkdir ${{ env.PROJECT_RELEASE_PATH }}
        ls
      shell: bash
        
    - name: Build raylib Library
      run: |
        cd raylib/src
        gcc --version
        make PLATFORM=PLATFORM_DESKTOP BUILD_MODE=RELEASE RAYLIB_LIBTYPE=STATIC RAYLIB_RELEASE_PATH=. -B

    - name: Build Product
      run: |
        cd ${{ env.PROJECT_REPO_NAME }}/src
        make PLATFORM=PLATFORM_DESKTOP BUILD_MODE=RELEASE PROJECT_SOURCE_FILES=${{ env.PROJECT_SOURCES }} PROJECT_CUSTOM_FLAGS=${{ env.PROJECT_CUSTOM_FLAGS }} PROJECT_BUILD_PATH=. RAYLIB_PATH=../../raylib

    # NOTE: Provided raylib source path for Makefile should be relative to:
    # ${{ env.PROJECT_REPO_NAME }}/test/cool_project/src
    - name: Build test Project
      run: |
        cd ${{ env.PROJECT_REPO_NAME }}/test/cool_project
        ../../src/${{ env.PROJECT_NAME }} -i cool_project.rpc --build Linux -p RAYLIB_SRC_PATH=../../../../raylib/src

    - name: Generate Test Project Artifacts
      run: |
        cd ${{ env.PROJECT_REPO_NAME }}/test/cool_project/build
        ls -R
        7z a ./cool_project.zip .

    # Package directory into zip and upload artifact
    # Avoid including the previously packaged .zip 
    - name: Upload Test Project Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: cool_project.zip
        path: |
            ${{ env.PROJECT_REPO_NAME }}/test/cool_project/build
            !${{ env.PROJECT_REPO_NAME }}/test/cool_project/build/cool_project.zip
