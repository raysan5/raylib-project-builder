name: Build Project + Test Project - Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_windows_test_project.yml'
    
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write       # Required for actions/upload-release-asset to upload release asset
    runs-on: windows-latest

    # WARNING: Project (internal) name could not be the same as repository name
    env:
      PROJECT_NAME: rpb
      PROJECT_REPO_NAME: ${{ github.event.repository.name }}
      PROJECT_BUILD_PATH: "${{ github.event.repository.name }}\\projects\\VS2022\\build\\rpb\\bin\\x64\\Release"
      PROJECT_RELEASE_PATH: rpb_dev_win_x64
      PROJECT_RESOURCES_SRC_PATH: src\resources
      PROJECT_RESOURCES_DST_PATH: resources

    steps:
    - name: Checkout this repo [rpb]
      uses: actions/checkout@master
      with:
        path: ${{ env.PROJECT_REPO_NAME }}
      
    - name: Checkout raylib repo
      uses: actions/checkout@v4
      with:
        repository: raysan5/raylib
        path: raylib

    # NOTE: Visual Studio project build configuration already defines all required directories where project is generated:
    # $(SolutionDir)\build\$(ProjectName)\bin\$(Platform)\$(Configuration)\
    - name: Setup Release Paths
      run: |
        echo "PROJECT_VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
        echo "PROJECT_RELEASE_PATH=${{ env.PROJECT_NAME }}_v${{ github.event.release.tag_name }}_win_x64" >> $GITHUB_ENV
      shell: bash
      if: github.event_name == 'release' && github.event.action == 'published'

    - name: Setup Environment
      run: |
        mkdir ${{ env.PROJECT_RELEASE_PATH }}
        dir
      shell: cmd

    - name: Setup MSBuild path
      uses: microsoft/setup-msbuild@v2

    - name: Build raylib Library + Product (VS2022 solution)
      run: |
        dir
        cd ${{ env.PROJECT_REPO_NAME }}/projects/VS2022
        msbuild.exe ${{ env.PROJECT_NAME }}.sln /target:${{ env.PROJECT_NAME }} /property:Configuration=Release /property:Platform=x64 /property:RaylibSrcPath="..\..\..\..\raylib\src"
        cd ../..
      shell: cmd
      
    - name: Build test Project
      run: |
        cd ${{ env.PROJECT_REPO_NAME }}/test/cool_project
        ${{ env.PROJECT_REPO_NAME }}/projects/VS2022/build/rpb/bin/x64/Release/${{ env.PROJECT_NAME }}.exe -i cool_project.rpc -o cool_project --build Windows -p RAYLIB_SRC_PATH=${{ env.PROJECT_REPO_NAME }}/../raylib/src -p PLATFORM_WINDOWS_DEFAULT_TOOLCHAIN=MSBUILD
        cd ../..

    - name: Generate Test Project Artifacts
      run: |
        dir ${{ env.PROJECT_REPO_NAME }}/test/cool_project
        7z a .\cool_project.zip .\${{ env.PROJECT_REPO_NAME }}/test/cool_project
      shell: cmd

    - name: Upload Test Project Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cool_project.zip
        path: |
            ./cool_project
            !./cool_project.zip
